[project]
name = "longvideohelper"
version = "1.0.0"
description = "A tool that uses Whisper and VLM for long video chapter dividing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.4",
    "faster-whisper>=1.1.0",
    "pydub>=0.25.1",
    "moviepy>=1.0.3",
    "litellm>=1.0.0",
    "tqdm>=4.66.0",
    "click>=8.1.0",
    "setuptools>=65.0.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0",
    "opencv-python>=4.8.0",
    "google-genai>=1.49.0",
]

[project.optional-dependencies]
transformers = ["transformers>=4.45.0", "torch>=2.0.0", "accelerate>=0.25.0"]
ocr = ["paddleocr>=2.7.0", "paddlepaddle>=2.6.0"]

[project.scripts]
longvideohelper = "longvideohelper.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
